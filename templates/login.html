{% extends "base.html" %}
{% set title = "Login • AURA Hotel" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card card-soft">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold mb-1">Login</h1>
        <p class="text-muted mb-4">Static demo login (no register, no DB).</p>

        <form method="post">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" data-test="login-username" class="form-control" required placeholder="admin">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" data-test="login-password" class="form-control" type="password" required placeholder="1234">
          </div>
          <button class="btn btn-primary w-100" data-test="login-submit" type="submit">
            Login <i class="bi bi-box-arrow-in-right"></i>
          </button>
        </form>

        <hr class="my-4">
        <div class="small text-muted">
          Demo credentials:
          <span class="badge text-bg-dark">admin</span>
          <span class="badge text-bg-dark">1234</span>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
